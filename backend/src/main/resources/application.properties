server.port=8080
server.servlet.context-path=/api

spring.application.name=vjti-hoc2027-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vjti_hoc2027_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=9a6f8b1234567890abcdef1234567890abcdef1234567890abcdef1234567890
app.jwt.expiration-ms=86400000

# File Upload Configuration
file.upload-dir=../uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
